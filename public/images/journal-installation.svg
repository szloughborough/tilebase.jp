<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">タイルシール：貼る前から完了まで</title><desc id="desc">実際の手順は、採用する品番の施工説明を優先します。。下地を確認：材質・凹凸・劣化：用途を照合。準備・仮配置：清掃と乾燥：柄・端部の位置。小面積で評価：接着・合わせ目：下地への影響。施工・記録：指定手順で施工：端部と使用条件</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">タイルシール：貼る前から完了まで</text><text x="60" y="172" font-size="22">実際の手順は、採用する品番の施工説明を優先します。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">下地を確認</text><text x="24" y="149" font-size="21">材質・凹凸・劣化</text><text x="24" y="183" font-size="21">用途を照合</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">準備・仮配置</text><text x="24" y="149" font-size="21">清掃と乾燥</text><text x="24" y="183" font-size="21">柄・端部の位置</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">小面積で評価</text><text x="24" y="149" font-size="21">接着・合わせ目</text><text x="24" y="183" font-size="21">下地への影響</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">施工・記録</text><text x="24" y="149" font-size="21">指定手順で施工</text><text x="24" y="183" font-size="21">端部と使用条件</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">不明な条件は、全面施工の前に確認する。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>