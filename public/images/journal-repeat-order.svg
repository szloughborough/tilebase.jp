<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">PB追加発注：前回の条件と照合する</title><desc id="desc">「前回と同じ」を、参照できる情報へ置き換えます。。前回資料：注文・仕様版：承認見本・包装版。変更の確認：変更なしも記録：代替案は再評価。受入照合：品番・識別情報：色柄・包装・数量。履歴の更新：比較条件と結果：次回の参照資料</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">PB追加発注：前回の条件と照合する</text><text x="60" y="172" font-size="22">「前回と同じ」を、参照できる情報へ置き換えます。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">前回資料</text><text x="24" y="149" font-size="21">注文・仕様版</text><text x="24" y="183" font-size="21">承認見本・包装版</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">変更の確認</text><text x="24" y="149" font-size="21">変更なしも記録</text><text x="24" y="183" font-size="21">代替案は再評価</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">受入照合</text><text x="24" y="149" font-size="21">品番・識別情報</text><text x="24" y="183" font-size="21">色柄・包装・数量</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">履歴の更新</text><text x="24" y="149" font-size="21">比較条件と結果</text><text x="24" y="183" font-size="21">次回の参照資料</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">色柄の判定範囲・比較方法は、対象品番で事前に相談。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>