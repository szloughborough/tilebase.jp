<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">床材比較：形状と固定方式を分ける</title><desc id="desc">どちらが優れるかではなく、用途と仕様を同じ条件で比べます。。片状の床材：一枚の寸法と配列：境界・柄の向き。シート状の床材：幅・長さと取り回し：柄リピート・接続部。共通の確認：下地・固定・撤去：販売単位・輸送</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">床材比較：形状と固定方式を分ける</text><text x="60" y="172" font-size="22">どちらが優れるかではなく、用途と仕様を同じ条件で比べます。</text><g transform="translate(53,225)"><rect width="350" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">片状の床材</text><text x="24" y="149" font-size="21">一枚の寸法と配列</text><text x="24" y="183" font-size="21">境界・柄の向き</text></g><g transform="translate(425,225)"><rect width="350" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">シート状の床材</text><text x="24" y="149" font-size="21">幅・長さと取り回し</text><text x="24" y="183" font-size="21">柄リピート・接続部</text></g><g transform="translate(797,225)"><rect width="350" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">共通の確認</text><text x="24" y="149" font-size="21">下地・固定・撤去</text><text x="24" y="183" font-size="21">販売単位・輸送</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">置くだけ・粘着式・接着剤は、別の分類軸。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>