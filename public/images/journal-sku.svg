<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">初回SKU：販売仮説を検証する</title><desc id="desc">柄を増やす前に、各商品の役割を整理します。。販売先：用途・説明内容：必要な仕様確認。商品構成：柄・サイズ：セット数と品番。初回計画：数量と予算：保管量・検証期間。実績で見直す：注文・問合せ：補充・保留・修正</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">初回SKU：販売仮説を検証する</text><text x="60" y="172" font-size="22">柄を増やす前に、各商品の役割を整理します。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">販売先</text><text x="24" y="149" font-size="21">用途・説明内容</text><text x="24" y="183" font-size="21">必要な仕様確認</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">商品構成</text><text x="24" y="149" font-size="21">柄・サイズ</text><text x="24" y="183" font-size="21">セット数と品番</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">初回計画</text><text x="24" y="149" font-size="21">数量と予算</text><text x="24" y="183" font-size="21">保管量・検証期間</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">実績で見直す</text><text x="24" y="149" font-size="21">注文・問合せ</text><text x="24" y="183" font-size="21">補充・保留・修正</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">数量や売れ筋の断定ではなく、検証するための枠組み。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>