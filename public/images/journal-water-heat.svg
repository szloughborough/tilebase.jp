<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">防水・耐熱：四つに分けて確認</title><desc id="desc">性能の言葉や数値だけで、使用場所を決めないために。。表面：水はね・清掃：対象試料と方法。端・接続部：水の経路：施工面の状態。粘着・下地：接着条件：温湿度・乾燥。熱・書類：温度と時間：報告の適用範囲</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">防水・耐熱：四つに分けて確認</text><text x="60" y="172" font-size="22">性能の言葉や数値だけで、使用場所を決めないために。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">表面</text><text x="24" y="149" font-size="21">水はね・清掃</text><text x="24" y="183" font-size="21">対象試料と方法</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">端・接続部</text><text x="24" y="149" font-size="21">水の経路</text><text x="24" y="183" font-size="21">施工面の状態</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">粘着・下地</text><text x="24" y="149" font-size="21">接着条件</text><text x="24" y="183" font-size="21">温湿度・乾燥</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">熱・書類</text><text x="24" y="149" font-size="21">温度と時間</text><text x="24" y="183" font-size="21">報告の適用範囲</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">材料表面の性能と、施工面全体の適合は別の確認。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>