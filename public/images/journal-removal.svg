<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">タイルシール：取り外し前の判断</title><desc id="desc">一律の方法ではなく、品番・下地・使用状況から確認します。。品番・下地：粘着と既存面：施工記録を読む。小範囲で確認：指定手順に従う：変化を観察。状態で判断：糊残りと損傷：無理に進めない。相談・記録：写真・使用期間：修復条件の確認</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">タイルシール：取り外し前の判断</text><text x="60" y="172" font-size="22">一律の方法ではなく、品番・下地・使用状況から確認します。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">品番・下地</text><text x="24" y="149" font-size="21">粘着と既存面</text><text x="24" y="183" font-size="21">施工記録を読む</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">小範囲で確認</text><text x="24" y="149" font-size="21">指定手順に従う</text><text x="24" y="183" font-size="21">変化を観察</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">状態で判断</text><text x="24" y="149" font-size="21">糊残りと損傷</text><text x="24" y="183" font-size="21">無理に進めない</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">相談・記録</text><text x="24" y="149" font-size="21">写真・使用期間</text><text x="24" y="183" font-size="21">修復条件の確認</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">加熱・薬剤は、製品と下地が認める方法かを確認。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>