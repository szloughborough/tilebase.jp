<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">法人見積：比較の前提をそろえる</title><desc id="desc">依頼条件と回答範囲を、一つの表で照合します。。仕様を固定：品番・構造・寸法：参照する仕様版。単位を統一：枚・セット・箱：包装の変更希望。範囲を比較：製品・初期費用：輸送・未確定項目。版を照合：回答日・有効期限：最終条件の合意</desc><rect width="1200" height="600" fill="#f8f7f4"/><g font-family="Noto Sans JP,Yu Gothic,Meiryo,sans-serif" fill="#3a3a3a"><text x="60" y="62" fill="#354e68" font-size="16" letter-spacing="3">TILEBASE / MATERIAL JOURNAL</text><text x="60" y="126" font-size="36" font-weight="600">法人見積：比較の前提をそろえる</text><text x="60" y="172" font-size="22">依頼条件と回答範囲を、一つの表で照合します。</text><g transform="translate(59,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">01</text><text x="24" y="100" font-size="26" font-weight="600">仕様を固定</text><text x="24" y="149" font-size="21">品番・構造・寸法</text><text x="24" y="183" font-size="21">参照する仕様版</text></g><g transform="translate(335,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">02</text><text x="24" y="100" font-size="26" font-weight="600">単位を統一</text><text x="24" y="149" font-size="21">枚・セット・箱</text><text x="24" y="183" font-size="21">包装の変更希望</text></g><g transform="translate(611,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">03</text><text x="24" y="100" font-size="26" font-weight="600">範囲を比較</text><text x="24" y="149" font-size="21">製品・初期費用</text><text x="24" y="183" font-size="21">輸送・未確定項目</text></g><g transform="translate(887,225)"><rect width="254" height="220" rx="3" fill="white" stroke="#d9d7d2"/><text x="24" y="45" fill="#89987e" font-size="23">04</text><text x="24" y="100" font-size="26" font-weight="600">版を照合</text><text x="24" y="149" font-size="21">回答日・有効期限</text><text x="24" y="183" font-size="21">最終条件の合意</text></g><path d="M60 490H1140" stroke="#d9d7d2"/><text x="60" y="535" font-size="23" fill="#354e68">概算と確定見積は、参照条件を分けて記録。</text><text x="60" y="574" font-size="17">編集部作成の選定・確認用模式図。製品の施工説明・試験結果ではありません。</text></g></svg>