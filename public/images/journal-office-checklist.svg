<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>オフィス床材の採用前チェック</title><rect width="1200" height="520" fill="#f8f7f4"/><g font-family="Noto Sans JP,sans-serif"><text x="38" y="85" font-size="34" fill="#354f68">オフィス床材の採用前チェック</text><text x="38" y="135" font-size="22" fill="#50564f">未確認の項目は、資料と評価条件をそろえる</text><rect x="38" y="230" width="255" height="180" rx="4" fill="#fff" stroke="#c8ccc5"/><text x="60" y="275" font-size="18" fill="#71816f">01</text><text x="60" y="330" font-size="26" fill="#303336">使用区画</text><path d="M301 320h18m-7-7 7 7-7 7" stroke="#354f68" fill="none" stroke-width="2"/><rect x="327" y="230" width="255" height="180" rx="4" fill="#fff" stroke="#c8ccc5"/><text x="349" y="275" font-size="18" fill="#71816f">02</text><text x="349" y="330" font-size="26" fill="#303336">荷重・下地</text><path d="M590 320h18m-7-7 7 7-7 7" stroke="#354f68" fill="none" stroke-width="2"/><rect x="616" y="230" width="255" height="180" rx="4" fill="#fff" stroke="#c8ccc5"/><text x="638" y="275" font-size="18" fill="#71816f">03</text><text x="638" y="330" font-size="26" fill="#303336">資料・評価</text><path d="M879 320h18m-7-7 7 7-7 7" stroke="#354f68" fill="none" stroke-width="2"/><rect x="905" y="230" width="255" height="180" rx="4" fill="#fff" stroke="#c8ccc5"/><text x="927" y="275" font-size="18" fill="#71816f">04</text><text x="927" y="330" font-size="26" fill="#303336">採用判断</text><text x="38" y="475" font-size="18" fill="#62685f">TILEBASE · 説明用の模式図／性能・適合を保証する図ではありません</text></g></svg>